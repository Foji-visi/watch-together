<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Смотрим вместе</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0e0e12; color:#eee; font-family:system-ui,-apple-system,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:#17171d; }
  input { flex:1; min-width:180px; padding:10px; border-radius:8px; border:1px solid #333; background:#0e0e12; color:#fff; font-size:16px; }
  button { padding:10px 14px; border:0; border-radius:8px; background:#e5484d; color:#fff; font-size:15px; cursor:pointer; }
  button.sec { background:#2a2a33; }
  #wrap { flex:1; display:flex; align-items:center; justify-content:center; position:relative; background:#000; }
  video { width:100%; max-height:calc(100vh - 110px); background:#000; }
  #status { padding:8px 12px; font-size:13px; color:#9a9aa5; background:#17171d; }
  #join { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.8); z-index:5; }
  #join button { font-size:20px; padding:16px 28px; }
</style>
</head>
<body>
<header>
  <input id="url" placeholder="Вставь ссылку на видео (.mp4 / .m3u8 / .webm)">
  <button id="load">Загрузить</button>
  <button id="share" class="sec">Ссылка на комнату</button>
  <button id="sync" class="sec">Синхронизировать</button>
</header>
<div id="wrap">
  <video id="v" controls playsinline preload="auto"></video>
  <div id="join"><button id="joinBtn">▶ Присоединиться</button></div>
</div>
<div id="status">Подключение…</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const v = $('v'), statusEl = $('status');

// комната из #hash
let room = location.hash.slice(1);
if (!room) { room = Math.random().toString(36).slice(2, 8); location.hash = room; }

let ws, lock = false, lockTimer, controller = false, hls, peers = 1;

function setStatus(t) { statusEl.textContent = t + ' • комната: ' + room + ' • зрителей: ' + peers; }
function remote(fn) { lock = true; clearTimeout(lockTimer); fn(); lockTimer = setTimeout(() => lock = false, 700); }
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function setSource(url) {
  if (!url) return;
  $('url').value = url;
  if (hls) { hls.destroy(); hls = null; }
  if (/\.m3u8(\?|$)/i.test(url) && !v.canPlayType('application/vnd.apple.mpegurl') && window.Hls && Hls.isSupported()) {
    hls = new Hls(); hls.loadSource(url); hls.attachMedia(v);
  } else {
    v.src = url;
  }
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => { send({ type: 'join', room }); setStatus('Онлайн'); };
  ws.onclose = () => { setStatus('Соединение потеряно, переподключаюсь…'); setTimeout(connect, 2000); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'peers') { peers = m.peers; setStatus('Онлайн'); }
    else if (m.type === 'state') {
      peers = m.peers;
      if (m.url) {
        setSource(m.url);
        v.addEventListener('loadedmetadata', function once() {
          v.removeEventListener('loadedmetadata', once);
          remote(() => { v.currentTime = m.time; if (m.playing) v.play().catch(()=>{}); });
        });
      }
      setStatus('Онлайн');
    }
    else if (m.type === 'load') setSource(m.url);
    else if (m.type === 'play') remote(() => { v.currentTime = m.time; v.play().catch(()=>{}); });
    else if (m.type === 'pause') remote(() => { v.pause(); v.currentTime = m.time; });
    else if (m.type === 'seek') remote(() => { v.currentTime = m.time; });
    else if (m.type === 'tick') {
      if (Math.abs(v.currentTime - m.time) > 1.5) remote(() => { v.currentTime = m.time; });
    }
  };
}

v.addEventListener('play',   () => { if (!lock) { controller = true; send({ type: 'play',  time: v.currentTime }); } });
v.addEventListener('pause',  () => { if (!lock) { controller = true; send({ type: 'pause', time: v.currentTime }); } });
v.addEventListener('seeked', () => { if (!lock) { controller = true; send({ type: 'seek',  time: v.currentTime }); } });
setInterval(() => { if (controller && !v.paused) send({ type: 'tick', time: v.currentTime }); }, 3000);

$('load').onclick = () => {
  const url = $('url').value.trim();
  if (!url) return;
  setSource(url); send({ type: 'load', url });
};
$('share').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $('share').textContent = 'Скопировано ✓'; }
  catch { prompt('Скопируй ссылку:', location.href); }
  setTimeout(() => $('share').textContent = 'Ссылка на комнату', 1500);
};
$('sync').onclick = () => send({ type: 'seek', time: v.currentTime });

// Нужен тап, чтобы iPhone разрешил звук и воспроизведение
$('joinBtn').onclick = () => {
  $('join').remove();
  v.muted = false;
  v.play().then(() => v.pause()).catch(()=>{});
  connect();
};
</script>
</body>
</html>
